server:
  port: 8083

spring:
  application:
    name: regional-dashboard-worker

voting:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    exchange:
      regional: live_results_regional
    routing-key: "results.*"

logging:
  level:
    root: INFO
    com.voting.platform: DEBUG
