server:
  port: 8082

spring:
  application:
    name: global-dashboard-worker

voting:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    exchange:
      global: live_results_global

logging:
  level:
    root: INFO
    com.voting.platform: DEBUG
