events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # DNS embebido de Docker Engine con refresco dinámico cada 5 segundos
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;
        server_name localhost;

        # Frontend estático: Portal y Dashboards
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Proxy hacia Voting API Gateway (Backend REST)
        location /vote {
            set $backend_api "http://voting-api:8080";
            proxy_pass $backend_api/vote;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # Proxy hacia Global Dashboard Worker (API REST y SSE)
        location /api/results/global {
            set $global_worker "http://global-dashboard-worker:8082";
            proxy_pass $global_worker/api/results/global;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /events/global {
            set $global_worker "http://global-dashboard-worker:8082";
            proxy_pass $global_worker/events/global;

            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

        # Proxy hacia Regional Dashboard Worker (API REST y SSE)
        location /api/results/regional {
            set $regional_worker "http://regional-dashboard-worker:8083";
            proxy_pass $regional_worker/api/results/regional;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /events/regional {
            set $regional_worker "http://regional-dashboard-worker:8083";
            proxy_pass $regional_worker/events/regional;

            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }
    }
}
