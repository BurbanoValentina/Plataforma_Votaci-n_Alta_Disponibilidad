events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Balanceo de Carga Round-Robin entre los nodos replicados de la plataforma
    upstream voting_edge_cluster {
        server voting-edge-1:8080 max_fails=3 fail_timeout=15s;
        server voting-edge-2:8080 max_fails=3 fail_timeout=15s;
    }

    server {
        listen 80;
        server_name _;

        # Streaming SSE (Server-Sent Events) sin buffering
        location ~ ^/(api/results/.*/stream|events/.*)$ {
            proxy_pass http://voting_edge_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
        }

        # Portal Web, API de Votación y Panel de Administración balanceados
        location / {
            proxy_pass http://voting_edge_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }
    }
}
