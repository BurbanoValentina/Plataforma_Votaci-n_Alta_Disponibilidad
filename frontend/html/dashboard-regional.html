<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Regional - Plataforma de Votación en Vivo</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.85);
            --border-color: #30363d;
            --accent-cyan: #58a6ff;
            --accent-green: #3fb950;
            --accent-purple: #bc8cff;
            --accent-orange: #d29922;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #bc8cff, #58a6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            background: rgba(63, 185, 80, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--accent-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
        }

        .regions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .region-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        .region-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .region-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .region-total {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .candidate-row {
            margin-bottom: 1rem;
        }

        .candidate-row:last-child {
            margin-bottom: 0;
        }

        .candidate-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.3rem;
            font-size: 0.95rem;
        }

        .score-box {
            display: flex;
            gap: 0.6rem;
            font-size: 0.85rem;
        }

        .raw-score {
            color: var(--text-secondary);
        }

        .weighted-score {
            color: var(--accent-purple);
            font-weight: bold;
        }

        .bar-bg {
            width: 100%;
            height: 16px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #8957e5, #bc8cff);
            border-radius: 8px;
            transition: width 0.5s ease-in-out;
        }

        .strategy-note {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(188, 140, 255, 0.08);
            border: 1px solid rgba(188, 140, 255, 0.3);
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
    <style>
        :root { --bg-color: #f7f9fc; --card-bg: #fff; --border-color: #e2e8f0; --accent-cyan: #315a85; --accent-green: #27845b; --accent-purple: #557aa3; --text-primary: #243247; --text-secondary: #64748b; }
        * { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { background: radial-gradient(circle at top right, #eaf2fa 0, transparent 35%), var(--bg-color); color: var(--text-primary); padding: clamp(1rem, 4vw, 3rem); }
        .container { max-width: 1120px; }
        header { margin-bottom: 1.5rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border-color); gap: 1rem; }
        h1 { color: var(--accent-cyan); background: none; -webkit-text-fill-color: initial; font-size: clamp(1.5rem, 3vw, 2.15rem); letter-spacing: -.03em; }
        .status-badge { background: #ddf3e7; color: var(--accent-green); border: 1px solid #a9ddc1; font-weight: 700; white-space: nowrap; }
        .status-dot { background-color: var(--accent-green); }
        .regions-grid { gap: 1.25rem; }
        .region-card { background: rgba(255,255,255,.96); border: 1px solid var(--border-color); border-radius: 18px; padding: 1.5rem; box-shadow: 0 12px 30px rgba(36,50,71,.08); transition: transform .2s ease, box-shadow .2s ease; }
        .region-card:hover { transform: translateY(-3px); box-shadow: 0 18px 36px rgba(36,50,71,.12); }
        .region-header { border-bottom: 1px solid var(--border-color); padding-bottom: .75rem; }
        .region-title { color: var(--accent-cyan); }
        .region-total, .raw-score { color: var(--text-secondary); }
        .weighted-score { color: var(--accent-purple); font-weight: 800; }
        .bar-bg { height: 14px; background: #eaf2fa; border: 1px solid var(--border-color); }
        .bar-fill { background: linear-gradient(90deg, #557aa3, #9bb9d4); }
        .strategy-note { margin-top: 1.5rem; padding: 1rem 1.25rem; background: #eaf2fa; border: 1px solid #c9dced; border-radius: 12px; color: var(--text-secondary); line-height: 1.6; }
        .strategy-note strong { color: var(--accent-cyan); }
        @media (max-width: 640px) { header { align-items: flex-start; flex-direction: column; } .status-badge { align-self: flex-start; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Reality Show - Resultados Regionales</h1>
                <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 4px;">
                    RabbitMQ Topic Exchange (results.*) + GoF Strategy Pattern Weighting
                </p>
            </div>
            <div id="statusBadge" class="status-badge">
                <div class="status-dot"></div>
                <span id="statusText">En Vivo (5s)</span>
            </div>
        </header>

        <div id="regionsContainer" class="regions-grid">
            <!-- Dynamically populated per region -->
        </div>

        <div class="strategy-note">
            <strong>Patrón Strategy Aplicado:</strong> Cada región procesa sus votos ponderados (ElectoralWeightingStrategy).
            NORTE (x1.25) | SUR (x1.15) | ESTE (x0.90) | OESTE (x1.05) | CENTRO (x1.40).
        </div>
    </div>

    <script>
        const regionsState = {
            NORTE: null, SUR: null, ESTE: null, OESTE: null, CENTRO: null
        };

        function renderRegions() {
            const container = document.getElementById('regionsContainer');
            let html = '';

            for (const [region, data] of Object.entries(regionsState)) {
                const total = data ? Number(data.totalRegionalVotes || 0) : 0;
                const rawVotes = data ? (data.rawVotes || {}) : {};
                const weightedVotes = data ? (data.weightedVotes || {}) : {};

                let candidatesHtml = '';
                const candidates = Object.keys(rawVotes);

                if (candidates.length === 0) {
                    candidatesHtml = '<p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.5rem;">Sin votos en esta región.</p>';
                } else {
                    candidates.forEach(cand => {
                        const raw = rawVotes[cand] || 0;
                        const weighted = weightedVotes[cand] || 0;
                        const pct = total > 0 ? ((raw / total) * 100).toFixed(1) : '0.0';

                        candidatesHtml += `
                            <div class="candidate-row">
                                <div class="candidate-info">
                                    <span>${cand}</span>
                                    <div class="score-box">
                                        <span class="raw-score">${raw} raw</span>
                                        <span class="weighted-score">${weighted} pts</span>
                                    </div>
                                </div>
                                <div class="bar-bg">
                                    <div class="bar-fill" style="width: ${Math.max(5, pct)}%"></div>
                                </div>
                            </div>
                        `;
                    });
                }

                html += `
                    <div class="region-card">
                        <div class="region-header">
                            <span class="region-title">Región ${region}</span>
                            <span class="region-total">${total} votos</span>
                        </div>
                        ${candidatesHtml}
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function connectSSE() {
            const eventSource = new EventSource('/api/results/regional/stream');

            eventSource.addEventListener('regional-init', function(e) {
                try {
                    const allData = JSON.parse(e.data);
                    Object.assign(regionsState, allData);
                    renderRegions();
                } catch (err) {
                    console.error("Error parsing init data", err);
                }
            });

            eventSource.addEventListener('regional-update', function(e) {
                try {
                    const update = JSON.parse(e.data);
                    if (update && update.region) {
                        regionsState[update.region] = update;
                        renderRegions();
                    }
                } catch (err) {
                    console.error("Error parsing regional update", err);
                }
            });

            eventSource.onerror = function() {
                document.getElementById('statusText').innerText = 'Reconectando...';
                document.getElementById('statusBadge').style.borderColor = '#d29922';
                document.getElementById('statusBadge').style.color = '#d29922';
            };

            eventSource.onopen = function() {
                document.getElementById('statusText').innerText = 'En Vivo (5s)';
                document.getElementById('statusBadge').style.borderColor = 'var(--accent-green)';
                document.getElementById('statusBadge').style.color = 'var(--accent-green)';
            };
        }

        async function fetchInitial() {
            try {
                const res = await fetch('/api/results/regional');
                if (res.ok) {
                    const data = await res.json();
                    Object.assign(regionsState, data);
                    renderRegions();
                }
            } catch (err) {
                console.error("Fetch failed", err);
            }
        }

        renderRegions();
        fetchInitial();
        connectSSE();
        setInterval(fetchInitial, 5000);
    </script>
    <script type="module" src="./firebase-auth.js"></script>
</body>
</html>
