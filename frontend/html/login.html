<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Plataforma de Votación</title>
    <style>
        :root { --navy: #315a85; --navy-dark: #24496f; --ink: #243247; --muted: #64748b; --bg: #f7f9fc; --border: #e2e8f0; --success: #27845b; --success-bg: #ddf3e7; --error: #a53b3b; --error-bg: #fff0f0; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; color: var(--ink); background: radial-gradient(circle at top right, #eaf2fa 0, transparent 38%), var(--bg); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .auth-shell { width: min(100%, 440px); }
        .brand { margin-bottom: 1.25rem; text-align: center; }
        .brand-mark { width: 52px; height: 52px; display: grid; place-items: center; margin: 0 auto 1rem; border-radius: 16px; color: #fff; background: var(--navy); box-shadow: 0 10px 22px rgba(49,90,133,.22); font-size: 1.45rem; }
        h1 { margin: 0; color: var(--navy); font-size: clamp(1.65rem, 5vw, 2.1rem); letter-spacing: -.04em; }
        .brand p { margin: .55rem 0 0; color: var(--muted); line-height: 1.5; }
        .auth-card { padding: clamp(1.35rem, 5vw, 2rem); background: rgba(255,255,255,.96); border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 18px 45px rgba(36,50,71,.1); }
        .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: .35rem; padding: .3rem; margin-bottom: 1.5rem; background: #f1f5f9; border-radius: 10px; }
        .tab { border: 0; padding: .65rem; border-radius: 8px; color: var(--muted); background: transparent; font-weight: 700; cursor: pointer; }
        .tab.active { color: var(--navy); background: #fff; box-shadow: 0 2px 8px rgba(36,50,71,.08); }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: .4rem; color: var(--ink); font-size: .84rem; font-weight: 700; }
        input { width: 100%; padding: .78rem .85rem; border: 1px solid var(--border); border-radius: 10px; color: var(--ink); background: #fff; font: inherit; }
        input:focus-visible, button:focus-visible { outline: 3px solid rgba(49,90,133,.22); outline-offset: 2px; }
        .primary { width: 100%; padding: .82rem 1rem; border: 0; border-radius: 10px; color: #fff; background: var(--navy); font: inherit; font-weight: 800; cursor: pointer; transition: background .2s, transform .2s; }
        .primary:hover { background: var(--navy-dark); transform: translateY(-1px); }
        .secondary-link { display: block; margin: .9rem 0 0; padding: 0; border: 0; color: var(--navy); background: none; font: inherit; font-size: .86rem; font-weight: 700; cursor: pointer; text-align: center; }
        .helper { margin-top: 1rem; color: var(--muted); font-size: .8rem; line-height: 1.5; text-align: center; }
        #message { display: none; margin-bottom: 1rem; padding: .75rem; border-radius: 10px; font-size: .85rem; line-height: 1.4; }
        #message.success { display: block; color: var(--success); background: var(--success-bg); }
        #message.error { display: block; color: var(--error); background: var(--error-bg); }
        #setup-warning { display: none; margin-top: 1rem; padding: .75rem; border: 1px solid #f0d28a; border-radius: 10px; color: #805d12; background: #fff8e8; font-size: .82rem; line-height: 1.45; }
    </style>
</head>
<body>
    <main class="auth-shell">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">✓</div>
            <h1>Acceso institucional</h1>
            <p>Ingresa para consultar y administrar la plataforma de votación.</p>
        </div>

        <section class="auth-card" aria-labelledby="auth-title">
            <div class="tabs" role="tablist" aria-label="Acceso o registro">
                <button class="tab active" id="login-tab" type="button" role="tab" aria-selected="true">Iniciar sesión</button>
                <button class="tab" id="register-tab" type="button" role="tab" aria-selected="false">Crear cuenta</button>
            </div>
            <h2 id="auth-title" style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);">Autenticación</h2>
            <div id="message" role="status" aria-live="polite"></div>
            <form id="auth-form">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input id="email" type="email" autocomplete="email" required placeholder="nombre@institucion.gov.co">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="Mínimo 6 caracteres">
                </div>
                <button class="primary" id="submit-button" type="submit">Ingresar</button>
            </form>
            <button class="secondary-link" id="reset-button" type="button">¿Olvidaste tu contraseña?</button>
            <p class="helper">Tu acceso se gestiona de forma segura mediante Firebase Authentication.</p>
            <div id="setup-warning">Firebase aún no está configurado. Completa <code>firebase-config.js</code> con la configuración de tu aplicación web.</div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
        import { firebaseConfig, isFirebaseConfigured } from "./firebase-config.js";

        const form = document.getElementById("auth-form");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const message = document.getElementById("message");
        const submitButton = document.getElementById("submit-button");
        const resetButton = document.getElementById("reset-button");
        const warning = document.getElementById("setup-warning");
        let mode = "login";

        const app = isFirebaseConfigured ? initializeApp(firebaseConfig) : null;
        const auth = app ? getAuth(app) : null;

        function showMessage(text, type = "error") {
            message.textContent = text;
            message.className = type;
        }

        function firebaseMessage(error) {
            const messages = {
                "auth/invalid-credential": "El correo o la contraseña no son correctos.",
                "auth/email-already-in-use": "Ya existe una cuenta con este correo.",
                "auth/weak-password": "La contraseña debe tener al menos 6 caracteres.",
                "auth/invalid-email": "Ingresa un correo electrónico válido.",
                "auth/too-many-requests": "Demasiados intentos. Espera unos minutos y vuelve a intentarlo."
            };
            return messages[error.code] || "No fue posible completar la operación. Intenta nuevamente.";
        }

        function setMode(nextMode) {
            mode = nextMode;
            document.getElementById("login-tab").classList.toggle("active", mode === "login");
            document.getElementById("register-tab").classList.toggle("active", mode === "register");
            document.getElementById("login-tab").setAttribute("aria-selected", mode === "login");
            document.getElementById("register-tab").setAttribute("aria-selected", mode === "register");
            submitButton.textContent = mode === "login" ? "Ingresar" : "Crear cuenta";
            passwordInput.autocomplete = mode === "login" ? "current-password" : "new-password";
            resetButton.style.display = mode === "login" ? "block" : "none";
            message.className = "";
        }

        document.getElementById("login-tab").addEventListener("click", () => setMode("login"));
        document.getElementById("register-tab").addEventListener("click", () => setMode("register"));

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            if (!auth) { warning.style.display = "block"; return; }
            submitButton.disabled = true;
            submitButton.textContent = "Procesando...";
            try {
                if (mode === "login") await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
                else await createUserWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
                showMessage(mode === "login" ? "Acceso correcto. Redirigiendo..." : "Cuenta creada. Redirigiendo...", "success");
                setTimeout(() => window.location.replace("index.html"), 500);
            } catch (error) {
                showMessage(firebaseMessage(error));
                submitButton.disabled = false;
                submitButton.textContent = mode === "login" ? "Ingresar" : "Crear cuenta";
            }
        });

        resetButton.addEventListener("click", async () => {
            if (!auth) { warning.style.display = "block"; return; }
            if (!emailInput.value.trim()) { showMessage("Escribe tu correo para enviarte el enlace de recuperación."); emailInput.focus(); return; }
            try { await sendPasswordResetEmail(auth, emailInput.value.trim()); showMessage("Revisa tu correo para restablecer la contraseña.", "success"); }
            catch (error) { showMessage(firebaseMessage(error)); }
        });

        if (!isFirebaseConfigured) warning.style.display = "block";
        if (auth) onAuthStateChanged(auth, (user) => { if (user) window.location.replace("index.html"); });
    </script>
</body>
</html>
